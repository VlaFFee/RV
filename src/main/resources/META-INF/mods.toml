modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''${mod_description}'''
# Client-side only: may be installed without being on the server.
displayTest="IGNORE_SERVER_VERSION"

[[dependencies.${mod_id}]]
    modId="forge"
    mandatory=true
    versionRange="${forge_version_range}"
    ordering="NONE"
    side="CLIENT"

[[dependencies.${mod_id}]]
    modId="minecraft"
    mandatory=true
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="CLIENT"

# Soft dependency: FP Studio. Loaded after it so the two cooperate; not required.
[[dependencies.${mod_id}]]
    modId="fpstudio"
    mandatory=false
    versionRange="[1.0.0,)"
    ordering="AFTER"
    side="CLIENT"

# Soft dependency: ParCool. Loaded after it; not required.
[[dependencies.${mod_id}]]
    modId="parcool"
    mandatory=false
    versionRange="[1.0,)"
    ordering="AFTER"
    side="CLIENT"
